services:
  postgres:
    image: postgres:16-alpine
    container_name: personas-wall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: personas_wall
      POSTGRES_PASSWORD: personas_wall_password
      POSTGRES_DB: personas_wall_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
